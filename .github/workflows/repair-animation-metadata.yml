name: Repair animation sprite metadata

on:
  pull_request:
    paths:
      - "scripts/repair_animation_metadata.py"
      - "tests/test_animation_metadata_repair.py"
      - ".github/workflows/repair-animation-metadata.yml"
  push:
    branches: [main]
    paths:
      - "scripts/repair_animation_metadata.py"
      - ".github/workflows/repair-animation-metadata.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-animation-sprites
  cancel-in-progress: false

jobs:
  verify-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify rectangle and aliases behavior
        run: python -m unittest discover -s tests -p 'test_animation_metadata_repair.py' -v
      - name: Preview representative broken Rangers
        run: python scripts/repair_animation_metadata.py --dry-run --unit u415e-riza --unit u415u-riza
      - name: Validate all sprite atlas data without writing
        run: python scripts/repair_animation_metadata.py --dry-run > /tmp/animation-metadata-preview.log
      - name: Show impact summary
        run: |
          tail -1 /tmp/animation-metadata-preview.log
          head -30 /tmp/animation-metadata-preview.log
      - name: Apply repair on published branch only
        if: github.event_name != 'pull_request'
        run: |
          python scripts/repair_animation_metadata.py > /tmp/animation-metadata-repair.log
          tail -1 /tmp/animation-metadata-repair.log
          git diff --stat | tail -10
      - name: Publish corrected metadata
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add animation_meta
          if git diff --cached --quiet; then
            echo "No metadata change."
          else
            git commit -m "Repair decimal plist sprites and alias metadata"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
