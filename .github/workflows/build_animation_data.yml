name: Build animation metadata

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-animation-data
  cancel-in-progress: true

jobs:
  build-animation-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build animation metadata
        run: python scripts/build_animation_data.py

      - name: Commit generated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add animation_meta
          if git diff --cached --quiet; then
            echo "No animation metadata changes."
          else
            git commit -m "Build Ranger animation metadata"
            git pull --rebase origin main
            git push
          fi
